
name: Backend checks

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check test-data seeder syntax
        run: node --check scripts/seed-test-data.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase email function
        run: deno check --no-config supabase/functions/send-email-notifications/index.ts
