name: Cloudflare email scheduler checks

on:
  pull_request:
    paths:
      - "cloudflare/email-scheduler/**"
      - ".github/workflows/cloudflare-email-scheduler-checks.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/email-scheduler/**"
      - ".github/workflows/cloudflare-email-scheduler-checks.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/email-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/email-scheduler/package-lock.json
      - run: npm ci
      - run: npm run check
