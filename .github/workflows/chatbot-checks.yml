name: Chatbot checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chatbot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: chatbot/requirements.txt
      - run: pip install -r chatbot/requirements.txt
      - run: python -m compileall -q chatbot
      - name: Run chatbot tests
        working-directory: chatbot
        run: python -m unittest -v test_app.py
