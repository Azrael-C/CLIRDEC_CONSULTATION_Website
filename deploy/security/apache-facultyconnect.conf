# Requires mod_proxy, mod_proxy_http, mod_headers, mod_reqtimeout, and mod_ratelimit.
<VirtualHost *:443>
    ServerName api.clsufacultyconnect.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ timeout=15 connectiontimeout=5
    ProxyPassReverse / http://127.0.0.1:8000/

    LimitRequestBody 16384
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    TimeOut 20

    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"

    <Location />
        <LimitExcept GET POST DELETE OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>
</VirtualHost>
