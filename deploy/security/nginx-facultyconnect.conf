limit_req_zone $binary_remote_addr zone=facultyconnect_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=facultyconnect_conn:10m;

server {
    listen 443 ssl http2;
    server_name api.clsufacultyconnect.com;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;

    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        limit_except GET POST DELETE OPTIONS { deny all; }
        limit_req zone=facultyconnect_api burst=8 nodelay;
        limit_conn facultyconnect_conn 10;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering on;
    }
}
